# รันเทสต์อัตโนมัติทุกครั้งที่ push หรือเปิด pull request (ทั้ง Go และ React)
name: test

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test -- --watchAll=false
      - run: npm run build                         # เช็กว่า build แบบเดียวกับ Vercel ผ่าน
        env:
          CI: true
